$kind: http-request
name: Create Event
method: POST
url: '{{baseUrl}}/events'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "event_name": "Tech Conference 2026",
      "description": "Annual tech conference",
      "start_date_time": "2026-06-01T09:00:00Z",
      "end_date_time": "2026-06-01T18:00:00Z",
      "address": "123 Main St, City",
      "event_for": "all",
      "image_id": null
    }
