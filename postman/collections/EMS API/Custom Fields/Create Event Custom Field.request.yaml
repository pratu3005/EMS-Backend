$kind: http-request
name: Create Event Custom Field
method: POST
url: '{{baseUrl}}/custom-fields/event/{{eventId}}'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "field_name": "T-Shirt Size",
      "field_type": "dropdown",
      "required": true
    }
